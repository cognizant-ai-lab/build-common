---
# Composed by quality-gate workflows -- see
# .github/workflows/ for the callers.
name: 'Run zizmor'
description: >-
  Static security analysis for GitHub Actions workflows.
  Detects template injection, credential persistence,
  unpinned actions, excessive permissions, and more.
author: 'Cognizant AI Lab'

inputs:
  inputs:
    description: >-
      Whitespace-separated paths to scan.
      Defaults to the current working directory.
    required: false
    default: '.'
  advanced-security:
    description: >-
      Upload SARIF results to GitHub Advanced Security.
      Requires security-events: write permission and
      GHAS enabled on the repository.
    required: false
    default: 'false'
  annotations:
    description: >-
      Add inline annotations to the PR for each finding.
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Run zizmor
      # v0.5.6
      uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d
      with:
        inputs: ${{ inputs.inputs }}
        advanced-security: ${{ inputs.advanced-security }}
        annotations: ${{ inputs.annotations }}
