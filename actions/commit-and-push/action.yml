---
name: Commit and push

description: >-
  Commit changed files to the checked-out branch through the
  GitHub API. GitHub signs the commit for the token's GitHub
  App, so it passes a "Require signed commits" rule. If the
  branch moves first, the changes are rebased and retried.

inputs:
  file_path:
    description: Space-separated files (pathspecs) to commit
    required: true
  commit_message:
    description: Commit message
    required: true
  author_name:
    description: Ignored
    required: false
    deprecationMessage: >-
      Ignored. The commit author is the token's bot; a custom
      author would make the commit unsigned.
  author_email:
    description: Ignored
    required: false
    deprecationMessage: >-
      Ignored. The commit author is the token's bot; a custom
      author would make the commit unsigned.
  github_token:
    description: >-
      GitHub App installation token (or GITHUB_TOKEN) with
      contents write access. A PAT makes an unsigned commit.
    required: false
    default: ${{ github.token }}
  working_directory:
    description: Directory of the checked-out repository
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Commit and push changes
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        INPUT_FILE_PATH: ${{ inputs.file_path }}
        INPUT_COMMIT_MESSAGE: ${{ inputs.commit_message }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: >-
        python3 "$GITHUB_ACTION_PATH/scripts/commit_via_api.py"
