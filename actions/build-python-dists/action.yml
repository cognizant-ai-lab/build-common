---
name: 'Build Python Distributions'
description: >-
  Build a Python package wheel and sdist into dist/.
  Publishing is intentionally left to the caller workflow:
  pypa/gh-action-pypi-publish is a Docker action and cannot
  run from inside a composite action.
author: 'Cognizant AI Lab'

inputs:
  python-version:
    description: 'Python version to use for building'
    required: false
    default: '3.10'
  working-directory:
    description: 'Working directory containing the Python package'
    required: false
    default: '.'
  use-cache:
    description: 'Use pip cache'
    required: false
    default: 'false'
  cache-dependency-path:
    description: >-
      Dependency file used to create the pip cache key.
      Caching is disabled unless this is provided and use-cache is true.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      # v6.2.0
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: ${{ inputs.python-version }}
        cache: >-
          ${{
            inputs.use-cache == 'true' &&
            inputs.cache-dependency-path != '' &&
            'pip' || ''
          }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Install build dependencies
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: python -m pip install build

    - name: Build wheel and sdist
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: python -m build
