---
name: Publish to PyPI

"on":
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use for building'
        required: false
        default: '3.10'
        type: string

      enable-slack:
        description: 'Send Slack notifications on completion'
        required: false
        default: true
        type: boolean

      build-common-ref:
        description: >-
          Git ref of build-common to use for shared actions.
          Defaults to "main"; override when testing a
          build-common PR.
        required: false
        default: 'main'
        type: string

    secrets:
      SLACK_WEBHOOK_URL:
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout build-common
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: cognizant-ai-lab/build-common
          ref: ${{ inputs.build-common-ref }}
          path: .build-common
          persist-credentials: false
          sparse-checkout: |
            actions

      - name: Setup Python environment
        uses: ./.build-common/actions/setup-python-env
        with:
          python-version: ${{ inputs.python-version }}
          requirements-file: ''
          requirements-build-file: ''
          install-extras: 'build'

      - name: Build wheel and sdist
        shell: bash
        run: python -m build

      - name: Publish to PyPI
        # v1.14.0
        # yamllint disable-line rule:line-length
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b

      - name: Notify Slack
        if: >-
          ${{
            !cancelled() &&
            inputs.enable-slack
          }}
        uses: ./.build-common/actions/slack-notify
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
