---
name: Python Quality Gate

"on":
  workflow_call:
    inputs:
      lint-toolchain:
        description: >-
          Lint/format stack to use.
          "ruff" runs ruff format --check and ruff check.
          "legacy" runs flake8 (and optionally black --check
          and isort --check-only).
          Both run pylint when run-pylint is true.
        required: false
        default: 'ruff'
        type: string

      python-version:
        description: 'Python version to use'
        required: false
        default: '3.12'
        type: string
      working-directory:
        description: 'Working directory for all steps'
        required: false
        default: '.'
        type: string
      requirements-file:
        description: 'Path to requirements.txt'
        required: false
        default: 'requirements.txt'
        type: string
      requirements-build-file:
        description: 'Path to requirements-build.txt'
        required: false
        default: 'requirements-build.txt'
        type: string
      system-packages:
        description: >-
          Space-separated list of apt packages to install
          (shellcheck and make are always included)
        required: false
        default: ''
        type: string

      sources:
        description: >-
          Space-separated source directories/files for
          ruff and pylint (ignored when lint-command-override
          is set)
        required: false
        default: '.'
        type: string

      run-black-check:
        description: 'Run black --check (legacy toolchain only)'
        required: false
        default: false
        type: boolean
      run-isort-check:
        description: 'Run isort --check-only (legacy toolchain only)'
        required: false
        default: false
        type: boolean

      run-pylint:
        description: 'Run pylint'
        required: false
        default: true
        type: boolean
      pylint-command:
        description: >-
          Custom pylint command for repos with non-standard
          invocation (e.g. "build_scripts/run_pylint.sh").
          When empty, runs "pylint <sources>".
        required: false
        default: ''
        type: string

      run-shellcheck:
        description: 'Run shellcheck on shell scripts'
        required: false
        default: true
        type: boolean
      shellcheck-command:
        description: >-
          Custom shellcheck command
          (e.g. "build_scripts/run_shellcheck.sh").
          When empty, uses the built-in find+shellcheck step.
        required: false
        default: ''
        type: string

      run-hadolint:
        description: 'Run hadolint on Dockerfile'
        required: false
        default: false
        type: boolean
      dockerfile-path:
        description: 'Path to Dockerfile for hadolint'
        required: false
        default: 'Dockerfile'
        type: string
      hadolint-failure-threshold:
        description: >-
          Rule severity threshold for hadolint pipeline
          failure (error, warning, info, style, ignore,
          none)
        required: false
        default: 'info'
        type: string

      run-zizmor:
        description: >-
          Run zizmor security analysis on GitHub Actions
          workflow files
        required: false
        default: false
        type: boolean

      run-markdownlint:
        description: 'Run pymarkdownlint on markdown files'
        required: false
        default: false
        type: boolean
      markdownlint-command:
        description: >-
          Custom markdownlint command
          (e.g. "build_scripts/run_markdownlint.sh").
          When empty, runs
          "pymarkdown --config .pymarkdownlint.yaml scan ./docs ./README.md".
        required: false
        default: ''
        type: string

      run-pytest:
        description: 'Run pytest'
        required: false
        default: true
        type: boolean
      test-python-versions:
        description: >-
          JSON list of Python versions to run the tests on
          (e.g. '["3.12", "3.13", "3.14"]').  When set, tests
          move out of the quality-gate job into a separate
          unit-tests matrix job, one per version.  When empty
          (default), tests run once inside the quality-gate
          job on python-version.
        required: false
        default: ''
        type: string
      pytest-markers:
        description: 'Pytest marker expression'
        required: false
        default: 'not integration and not smoke'
        type: string
      pytest-extra-args:
        description: >-
          Extra arguments passed to pytest
          (e.g. "--cov=mypackage -n auto")
        required: false
        default: ''
        type: string

      check-readme-pypi:
        description: 'Check README renders on PyPI'
        required: false
        default: false
        type: boolean

      enable-slack:
        description: 'Send Slack notifications'
        required: false
        default: true
        type: boolean

      lint-command-override:
        description: >-
          Skip ALL individual lint/format steps and run
          this single command instead
          (e.g. "make lint-check").
        required: false
        default: ''
        type: string

      test-command-override:
        description: >-
          Skip the built-in pytest step and run this
          command instead (e.g. "make test").
        required: false
        default: ''
        type: string

      build-common-ref:
        description: >-
          Git ref (branch, tag, or SHA) of build-common to
          check out for shared actions and scripts.  Defaults
          to "main"; override when testing a build-common PR.
        required: false
        default: 'main'
        type: string

    secrets:
      OPENAI_API_KEY:
        required: false
      SLACK_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      # Checkout build-common so reusable-workflow steps can
      # call shared composite actions and scripts
      # (github.action_path is not available in reusable
      # workflows, only in composite actions -- see
      # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#github-context).
      - name: Checkout build-common
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: cognizant-ai-lab/build-common
          ref: ${{ inputs.build-common-ref }}
          path: .build-common
          persist-credentials: false
          sparse-checkout: |
            scripts
            actions

      # Shared with the unit-tests job below: system
      # packages, requirements detection and the
      # setup-python-env action.
      - name: Setup Python CI environment
        uses: ./.build-common/actions/python-ci-setup
        with:
          python-version: ${{ inputs.python-version }}
          working-directory: ${{ inputs.working-directory }}
          requirements-file: ${{ inputs.requirements-file }}
          requirements-build-file: ${{ inputs.requirements-build-file }}
          system-packages: ${{ inputs.system-packages }}

      # ── Validate lint-toolchain ──────────────────────
      # Fail fast when the caller passes an unrecognised
      # toolchain value.  Without this gate an invalid
      # value like "typo" silently skips every lint step
      # and the build passes green.  The check is skipped
      # when lint-command-override is set because the
      # override bypasses toolchain selection entirely.
      - name: Validate lint-toolchain input
        if: ${{ inputs.lint-command-override == '' }}
        shell: bash
        env:
          TOOLCHAIN: ${{ inputs.lint-toolchain }}
        run: |
          case "$TOOLCHAIN" in
            ruff|legacy) ;;
            *)
              echo "::error::Invalid lint-toolchain value" \
                "'$TOOLCHAIN'. Must be 'ruff' or 'legacy'."
              exit 1
              ;;
          esac

      # ── Lint command override (escape hatch) ──────────
      - name: Run lint command override
        if: ${{ inputs.lint-command-override != '' }}
        shell: bash
        env:
          LINT_CMD: ${{ inputs.lint-command-override }}
        run: |
          bash -c "$LINT_CMD"

      # ── Lint: ruff / legacy / pylint ─────────────────
      # Compose the shared run-python-lint action instead
      # of reimplementing ruff, flake8, black, isort, and
      # pylint steps inline.  The action delegates to
      # dedicated shell scripts and supports both the
      # "ruff" and "legacy" toolchains.
      - name: Run Python lint
        if: ${{ inputs.lint-command-override == '' }}
        uses: ./.build-common/actions/run-python-lint
        with:
          toolchain: ${{ inputs.lint-toolchain }}
          sources: ${{ inputs.sources }}
          run-pylint: ${{ inputs.run-pylint }}
          pylint-command: ${{ inputs.pylint-command }}
          run-black-check: ${{ inputs.run-black-check }}
          run-isort-check: ${{ inputs.run-isort-check }}
          working-directory: ${{ inputs.working-directory }}

      # ── Shared: shellcheck ───────────────────────────
      - name: Run shellcheck
        if: >-
          ${{
            inputs.lint-command-override == '' &&
            inputs.run-shellcheck
          }}
        shell: bash
        env:
          SHELLCHECK_CMD: ${{ inputs.shellcheck-command }}
        run: |
          if [ -n "$SHELLCHECK_CMD" ]; then
            bash -c "$SHELLCHECK_CMD"
          else
            find . -type f -name '*.sh' -not -path '*/venv/*' \
              -not -path '*/.venv/*' \
              -not -path '*/.build-common/*' -print0 \
              | xargs --no-run-if-empty -0 shellcheck
          fi

      # ── Shared: markdownlint ─────────────────────────
      - name: Run markdownlint
        if: >-
          ${{
            inputs.lint-command-override == '' &&
            inputs.run-markdownlint
          }}
        shell: bash
        env:
          MARKDOWNLINT_CMD: ${{ inputs.markdownlint-command }}
        run: |
          if [ -n "$MARKDOWNLINT_CMD" ]; then
            bash -c "$MARKDOWNLINT_CMD"
          else
            pymarkdown --config ./.pymarkdownlint.yaml \
              scan ./docs ./README.md
          fi

      # ── Shared: hadolint ──────────────────────────────
      # Hadolint lints Dockerfiles, which is orthogonal to
      # Python lint.  Run it regardless of whether the
      # caller uses lint-command-override.
      - name: Run hadolint
        if: ${{ inputs.run-hadolint }}
        uses: ./.build-common/actions/run-hadolint
        with:
          dockerfile: ${{ inputs.dockerfile-path }}
          failure-threshold: ${{ inputs.hadolint-failure-threshold }}

      # ── Shared: zizmor ─────────────────────────────────
      # Zizmor scans GitHub Actions workflows, which is
      # orthogonal to Python lint.  Run it regardless of
      # whether the caller uses lint-command-override.
      - name: Run zizmor
        if: ${{ inputs.run-zizmor }}
        uses: ./.build-common/actions/run-zizmor

      # ── Test ──────────────────────────────────────────
      # Skipped when test-python-versions is set; the
      # unit-tests matrix job below runs the tests instead.
      - name: Run test command override
        if: >-
          ${{
            inputs.test-python-versions == '' &&
            inputs.test-command-override != ''
          }}
        shell: bash
        env:
          TEST_CMD: ${{ inputs.test-command-override }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          bash -c "$TEST_CMD"

      - name: Run pytest
        if: >-
          ${{
            inputs.test-python-versions == '' &&
            inputs.test-command-override == '' &&
            inputs.run-pytest
          }}
        shell: bash
        env:
          PYTEST_MARKERS: ${{ inputs.pytest-markers }}
          PYTEST_EXTRA: ${{ inputs.pytest-extra-args }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # shellcheck disable=SC2086
          pytest --verbose -m "$PYTEST_MARKERS" $PYTEST_EXTRA

      # ── README / PyPI check ──────────────────────────
      - name: Check README renders on PyPI
        if: ${{ inputs.check-readme-pypi }}
        shell: bash
        run: |
          pip install readme_renderer "readme_renderer[md]"
          python -m readme_renderer README.md

      # ── Slack notification ───────────────────────────
      # Single step for both success and failure.
      # job.status provides the outcome automatically;
      # !cancelled() ensures we skip only on cancellation.
      # When a test matrix is in use, the notify job below
      # reports the combined result instead.
      - name: Notify Slack
        if: >-
          ${{
            !cancelled() &&
            inputs.enable-slack &&
            inputs.test-python-versions == ''
          }}
        uses: ./.build-common/actions/slack-notify
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ── Unit tests across a Python version matrix ────────
  # Only runs when test-python-versions is set.  Lint and
  # the other checks stay in quality-gate on python-version;
  # this job only sets up the environment and runs tests.
  unit-tests:
    name: Unit tests (${{ matrix.python-version }})
    if: >-
      ${{
        inputs.test-python-versions != '' &&
        inputs.run-pytest
      }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.test-python-versions) }}

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Checkout build-common
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: cognizant-ai-lab/build-common
          ref: ${{ inputs.build-common-ref }}
          path: .build-common
          persist-credentials: false
          sparse-checkout: |
            scripts
            actions

      - name: Setup Python CI environment
        uses: ./.build-common/actions/python-ci-setup
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: ${{ inputs.working-directory }}
          requirements-file: ${{ inputs.requirements-file }}
          requirements-build-file: ${{ inputs.requirements-build-file }}
          system-packages: ${{ inputs.system-packages }}

      - name: Run test command override
        if: ${{ inputs.test-command-override != '' }}
        shell: bash
        env:
          TEST_CMD: ${{ inputs.test-command-override }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          bash -c "$TEST_CMD"

      - name: Run pytest
        if: ${{ inputs.test-command-override == '' }}
        shell: bash
        env:
          PYTEST_MARKERS: ${{ inputs.pytest-markers }}
          PYTEST_EXTRA: ${{ inputs.pytest-extra-args }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # shellcheck disable=SC2086
          pytest --verbose -m "$PYTEST_MARKERS" $PYTEST_EXTRA

  # ── Combined Slack notification ──────────────────────
  # One message for the whole run when a test matrix is
  # in use, instead of one per matrix job.
  notify:
    name: Notify Slack
    needs: [quality-gate, unit-tests]
    if: >-
      ${{
        !cancelled() &&
        inputs.enable-slack &&
        inputs.test-python-versions != ''
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout build-common
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: cognizant-ai-lab/build-common
          ref: ${{ inputs.build-common-ref }}
          path: .build-common
          persist-credentials: false
          sparse-checkout: |
            scripts
            actions

      - name: Notify Slack
        uses: ./.build-common/actions/slack-notify
        with:
          status: >-
            ${{
              contains(needs.*.result, 'failure') && 'failure'
              || 'success'
            }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
